<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Dashboard · Austin Muñoz</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root{--bg:#0b0d12;--panel:#141821;--panel2:#1b202b;--line:#262c39;--txt:#e8ebf2;--mut:#8b93a7;--acc:#6aa8ff;--up:#3ddc97;--down:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,#1a2240 0,transparent 60%),var(--bg);color:var(--txt);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif}
.wrap{max-width:1180px;margin:auto;padding:28px 20px 60px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}header h1{margin:0;font-size:26px;letter-spacing:-.02em}
.sp{flex:1}.mut{color:var(--mut)}.small{font-size:12px}
button{background:var(--acc);color:#071022;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}button:active{transform:scale(.97)}button.ghost{background:var(--panel2);color:var(--txt)}
details{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:14px 0;min-width:0;max-width:100%}
details>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:18px}
details>summary::-webkit-details-marker{display:none}details>summary::after{content:'▸';margin-left:auto;color:var(--mut);transition:.2s}details[open]>summary::after{transform:rotate(90deg)}
details .body{padding:0 18px 18px}details details{background:var(--panel2);border-radius:14px}details details>summary{font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:linear-gradient(180deg,#1d2330,#171b25);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}.card .v{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.card .t{font-size:13px;margin-top:2px}.card.hero{grid-column:span 2;background:linear-gradient(135deg,#1e3a6e,#172036)}.card.hero .v{font-size:46px;color:#bcd6ff}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--mut)}
.ico{width:40px;height:40px;border-radius:10px;object-fit:cover;flex:none}.ava{display:inline-grid;place-items:center;background:#334;font-weight:700}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:#2a3142;color:#cfd6e6;font-weight:600}
.pill.REJECTED{background:#4a1f25;color:#ff9aa5}.pill.READY_FOR_SALE{background:#173d2e;color:#7ef0b8}.pill.PREPARE_FOR_SUBMISSION{background:#3d3517;color:#ffd77a}.pill.WAITING_FOR_REVIEW,.pill.IN_REVIEW{background:#1f2e4a;color:#9cc2ff}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500;font-size:12px;text-transform:uppercase}
.chart{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:14px}h4{margin:18px 0 6px;color:var(--mut);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.err{background:#3a1d1d;color:#ffb3b3;padding:10px 14px;border-radius:10px;margin:10px 0}
html,body{overflow-x:hidden;max-width:100%}.wrap,.body,.card,.chart,.grid>*{min-width:0;max-width:100%}
details>summary{flex-wrap:wrap;min-width:0}.card .v{overflow-wrap:anywhere}code{overflow-wrap:anywhere}
.tw{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}.tw table{min-width:520px}
.chart canvas{max-width:100%}
@media(max-width:640px){.wrap{padding:16px 10px 40px}details .body{padding:0 10px 12px}details>summary{padding:14px 12px;font-size:16px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card.hero{grid-column:1/-1}.card .v{font-size:22px}.card.hero .v{font-size:34px}
header h1{font-size:21px;width:100%}
.tw table{min-width:0}.tw table,.tw tbody,.tw tr,.tw td{display:block;width:100%}.tw tr:has(th){display:none}
.tw tr{background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:6px 10px}
.tw td{display:flex;justify-content:space-between;gap:12px;border:0;padding:5px 0;text-align:right;overflow-wrap:anywhere}
.tw td::before{content:attr(data-label);color:var(--mut);font-size:12px;text-transform:uppercase;text-align:left;flex:none}
.tw td[data-label=""]::before{content:none}.tw td:first-child{font-weight:600}}
.pill.intro{background:#3d2a14;color:#ffbf7a}.pill.code{background:#22264a;color:#b7bdff}.pill.converted{background:#173d2e;color:#7ef0b8}.pill.cancelled,.pill.partly{background:#4a1f25;color:#ff9aa5}.pill.trial{background:#1f2e4a;color:#9cc2ff}.pill.due{background:#3d3517;color:#ffd77a}
tr.next td{background:rgba(255,191,122,.08)}.card.next{background:linear-gradient(135deg,#5a3410,#2a1c10);border-color:#7a4a1a}.card.next .v{color:#ffd7a8}
.chart.tall{height:300px}.chart.mid{height:240px}@media(max-width:640px){.chart.tall{height:260px}.chart.mid{height:220px}}
.pill{max-width:100%;overflow-wrap:anywhere;white-space:normal}details>summary>*{min-width:0}
</style></head><body><div class="wrap">
<header><h1>📊 Product Dashboard</h1><span class="sp"></span><span class="mut small" id="upd">Loading…</span>
<button class="ghost" onclick="toggleAll(true)">Expand all</button><button class="ghost" onclick="toggleAll(false)">Collapse all</button><button id="refresh" onclick="load()">⟳ Refresh</button></header>
<div class="mut small">Refresh reloads the latest published data.json (cache-busted). New data is published by running <code>update.sh</code>.</div>
<div id="errs"></div><div id="root"></div></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const usd=x=>x==null?'—':'$'+(+x).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}), num=x=>x==null?'—':(+x).toLocaleString();
const charts=[];
const ppp=g=>{const x=g.ads||{};return x.plays&&x.ad_playtime_h!=null?x.ad_playtime_h*60/x.plays:null}, fm=v=>v==null?'—':v.toFixed(1)+' min';
function trend(cur,prev,label='vs prev'){if(prev==null||cur==null)return '';cur=+cur;prev=+prev;if(prev===0&&cur===0)return `<div class="t flat">→ 0% ${label}</div>`;
 if(prev===0)return `<div class="t up">▲ new ${label}</div>`;const p=(cur-prev)/prev*100;return `<div class="t ${p>0?'up':p<0?'down':'flat'}">${p>0?'▲':p<0?'▼':'→'} ${Math.abs(p).toFixed(1)}% ${label}</div>`}
function pctT(p){if(p==null)return '';return `<div class="t ${p>0?'up':p<0?'down':'flat'}">${p>0?'▲':p<0?'▼':'→'} ${Math.abs(p)}% vs prior 7d</div>`}
const card=(l,v,t='',cls='')=>`<div class="card ${cls}"><div class="l">${l}</div><div class="v">${v}</div>${t}</div>`;
const icon=(src,name)=>src?`<img class="ico" src="${src}" alt="">`:`<span class="ico ava">${esc(name)[0]}</span>`;
function sec(id,title,inner,open=true){return `<details data-id="${id}" ${open?'open':''}><summary>${title}</summary><div class="body">${inner}</div></details>`}
function restore(){document.querySelectorAll('details[data-id]').forEach(d=>{const s=localStorage.getItem('dash:'+d.dataset.id);if(s!==null)d.open=s==='1';
 d.addEventListener('toggle',()=>{localStorage.setItem('dash:'+d.dataset.id,d.open?'1':'0');charts.forEach(c=>c.resize())})})}
function tables(){document.querySelectorAll('#root table').forEach(t=>{if(!t.parentElement.classList.contains('tw')){const w=document.createElement('div');w.className='tw';t.before(w);w.append(t)}
 const h=[...t.querySelectorAll('tr:first-child th')].map(x=>x.textContent);t.querySelectorAll('tr').forEach(r=>[...r.children].forEach((c,i)=>{if(c.tagName==='TD')c.dataset.label=h[i]??''}))})}
function toggleAll(o){document.querySelectorAll('details[data-id]').forEach(d=>d.open=o)}
Chart.defaults.color='#8b93a7';Chart.defaults.borderColor='#262c39';Chart.defaults.font.family='Inter,system-ui,sans-serif';
function mk(id,cfg){setTimeout(()=>{const el=document.getElementById(id);if(el)charts.push(new Chart(el,cfg))},0)}
function render(d){
 charts.splice(0).forEach(c=>c.destroy());
 $('#upd').textContent='Last updated: '+d.updated_at;$('#errs').innerHTML=(d.errors||[]).map(e=>`<div class="err">⚠ ${esc(e)}</div>`).join('');
 const apps=Object.fromEntries((d.asc?.apps||[]).map(a=>[a.id,a]));const m=d.meta||{},T=m.today||{},Y=m.yesterday||{},W=m.last_7d||{};
 const aa=d.apple_ads||{campaigns:[]},ra=d.roblox_ads||{},games=d.roblox?.games||[];
 const apple7=aa.campaigns.reduce((s,c)=>s+(+(c.last_7d?.spend??c.last_7d_spend)||0),0), meta7=+W.spend||0, rbx7=+ra.total_spend_7d||0;
 // ---- ADS
 let ads=`<div class="grid">${card('Total ad spend · 7d',usd(meta7+apple7+rbx7),`<div class="t mut">Meta ${usd(meta7)} · Apple ${usd(apple7)} · Roblox ${usd(rbx7)}</div>`,'hero')}
  ${card('Roblox spend · 28d',usd(ra.total_spend_28d))}${card('Meta spend today',usd(T.spend),trend(T.spend,Y.spend,'vs yesterday'))}</div>
  <div class="chart"><canvas id="cSplit" height="70"></canvas></div>`;
 const L=m.lifetime||{};
 let metaIn=`<div class="mut small">Days in ad-account time (${esc(m.account_timezone||'')}); 7d = last 7 days incl. today. Clicks &amp; CTR = link clicks.</div>
  <h4>Lifetime (Maximum)</h4><div class="grid">${card('Amount spent',usd(L.spend),L.lifetime_budget?`<div class="t mut">of ${usd(L.lifetime_budget)} budget</div>`:'','hero')}
  ${card('Budget remaining',L.budget_remaining!=null?usd(L.budget_remaining):'—')}${card('Reach',num(L.reach))}${card('Impressions',num(L.impressions))}${card('App installs',num(L.installs))}
  ${card('Link clicks',num(L.link_clicks))}${card('Link CTR',(+L.link_ctr||0).toFixed(2)+'%')}</div>
  <h4>Today vs yesterday · last 7 days</h4><div class="grid">${card('Spend · today',usd(T.spend),trend(T.spend,Y.spend,'vs yday'))}${card('Spend · 7d (incl. today)',usd(W.spend))}
  ${card('Impressions · today',num(T.impressions),trend(T.impressions,Y.impressions,'vs yday'))}${card('Impressions · 7d',num(W.impressions))}${card('Reach · 7d',num(W.reach))}
  ${card('Link clicks · 7d',num(W.link_clicks),`<div class="t mut">${num(W.all_clicks)} clicks (all)</div>`)}${card('Link CTR · 7d',(+W.link_ctr||0).toFixed(2)+'%')}${card('Cost / link click · 7d',W.cost_per_link_click?usd(W.cost_per_link_click):'—')}</div>
  <div class="chart"><canvas id="cMeta" height="80"></canvas></div>`;
 const byApp={};(m.campaigns_lifetime||m.campaigns_7d||[]).forEach(c=>{const a=Object.values(apps).find(a=>c.campaign_name.toLowerCase().includes(a.name.split(' ')[0].toLowerCase()));(byApp[a?.id||'other']??=[]).push(c)});
 for(const[aid,cs]of Object.entries(byApp)){const a=apps[aid];metaIn+=sec('meta-'+aid,`${icon(a?.icon,a?.name||'?')} ${esc(a?.name||'Other')} <span class="pill">${cs.length} campaign${cs.length>1?'s':''}</span>`,
  `<table><tr><th>Campaign (lifetime)</th><th>Status</th><th>Spent</th><th>Budget left</th><th>Reach</th><th>Impr.</th><th>Link clicks</th><th>Link CTR</th><th>$/link click</th><th>Installs</th></tr>${cs.map(c=>`<tr><td>${esc(c.campaign_name)}</td><td>${esc(c.status||'')}</td><td>${usd(c.spend)}${c.lifetime_budget?' / '+usd(c.lifetime_budget):''}</td><td>${c.budget_remaining!=null?usd(c.budget_remaining):'—'}</td><td>${num(c.reach)}</td><td>${num(c.impressions)}</td><td>${num(c.link_clicks)}</td><td>${(+c.link_ctr||0).toFixed(2)}%</td><td>${c.cost_per_link_click?usd(c.cost_per_link_click):'—'}</td><td>${num(c.installs)}</td></tr>`).join('')}</table>`)}
 ads+=sec('meta','<span>Ⓜ️ Meta Ads</span>',metaIn);
 const aBy={};aa.campaigns.forEach(c=>(aBy[c.app_id||'other']??=[]).push(c));let appleIn='';
 for(const[aid,cs]of Object.entries(aBy)){const a=apps[aid];appleIn+=sec('apple-'+aid,`${icon(a?.icon,a?.name||'?')} ${esc(a?.name||'Other')}`,
  cs.map(c=>{const s=(t,x)=>x?`<h4>${t}</h4><div class="grid">${card('Spend',usd(x.spend),'',t==='Lifetime'?'hero':'')}${card('Impressions',num(x.impressions))}${card('Taps',num(x.taps))}${card('TTR',x.ttr_pct!=null?x.ttr_pct+'%':'—')}${card('Installs',num(x.installs),x.tap_through_installs!=null?`<div class="t mut">${x.tap_through_installs} tap-through</div>`:'')}${card('Avg CPT',x.cpt!=null?usd(x.cpt):'—')}${x.cpm!=null?card('CPM',usd(x.cpm)):''}${x.cpa!=null?card('CPA',usd(x.cpa)):''}${x.cr_pct!=null?card('Conv. rate',x.cr_pct+'%'):''}</div>`:'';
  return `<div class="mut small">${esc(c.name)} · <span class="pill READY_FOR_SALE">${esc(c.status)}</span> · ${esc(c.bid_strategy||'')}${c.target_cpa?' · target CPA '+usd(c.target_cpa):''} · ${usd(c.daily_budget)}/day · ${esc(c.placement||'')}</div>`+(c.last_7d||c.yesterday||c.lifetime?s('Last 7 days',c.last_7d)+s('Yesterday'+(c.yesterday?.date?' ('+c.yesterday.date+')':''),c.yesterday)+s('Lifetime',c.lifetime):`<div class="grid" style="margin-top:10px">${card('Daily budget',usd(c.daily_budget))}${card('Spend · 7d',usd(c.last_7d_spend))}${card('Impressions · 7d',num(c.last_7d_impressions))}</div>`)}).join(''))}
 ads+=sec('apple',`<span> Apple Ads</span> <span class="mut small">as of ${esc(aa.as_of)} · manual</span>`,appleIn);
 ads+=sec('rbxads',`<span>🎮 Roblox Ads</span> <span class="mut small">${esc(ra.period||'')} · manual${ra.note?' · '+esc(ra.note):''}</span>`,`<table><tr><th></th><th>Game</th><th>Spend 28d</th><th>Spend 7d</th><th>Impr.</th><th>CTR</th><th>Clicks</th><th>Plays</th><th>$/play</th><th>Playtime/ad play</th><th>Status</th></tr>${games.map(g=>{const x=g.ads||{};return `<tr><td>${icon(g.icon,g.name)}</td><td>${esc(g.name)}</td><td>${usd(x.spend_28d)}</td><td>${usd(x.spend_7d)}</td><td>${num(x.impressions)}</td><td>${x.ctr_pct??'—'}%</td><td>${num(x.clicks)}</td><td>${num(x.plays)}</td><td>${usd(x.cost_per_play)}</td><td>${fm(ppp(g))}</td><td class="mut">${esc(x.campaign)}</td></tr>`}).join('')}</table>`);
 // ---- APP STORE
 const sales=d.asc?.sales||[];const tot=k=>sales.reduce((s,x)=>s+Object.values(x.apps).reduce((a,p)=>a+(p[k]||0),0),0);
 let asc=`<div class="grid">${card(`Downloads · ${sales.length}d`,num(tot('downloads')),'','hero')}${card('New subs / trials',num(tot('new_subs')),`<div class="t mut">${tot('new_subs_paid')} paid · ${tot('new_subs_free')} free/trial</div>`)}${card('Redownloads',num(tot('redownloads')))}${card('Proceeds',usd(tot('proceeds')))}</div>
  ${sales.length?'':`<div class="err">${esc(d.asc?.sales_note||'No sales data')}</div>`}`;

 // ---- installs per day + trial cohorts (from asc.reports)
 const R=d.asc?.reports;
 if(R){const ins=R.installs||{},ids=Object.keys(ins),COL={'6805914932':'#6aa8ff','6819824551':'#ff9f43'},fmtD=x=>new Date(x+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
  const lastOk=R.dates.filter(x=>R.sales_status[x]==='ok'||R.sales_status[x]==='none').pop();
  let iv=`<div class="grid">${ids.map(a=>card(esc(ins[a].name)+' · installs since launch',num(ins[a].total_first_time),`<div class="t mut">since ${ins[a].launch?fmtD(ins[a].launch):'—'} · +${num(ins[a].total_redownloads)} re-downloads</div>`,'hero')).join('')}</div>
   <div class="chart tall"><canvas id="cInst"></canvas></div><div class="mut small">First-time downloads (types ${esc(R.product_types_counted.join('/'))}); excludes re-downloads (3F) &amp; updates (7F). Data through ${lastOk?fmtD(lastOk):'—'}${R.pending_days.length?` · not yet published: ${R.pending_days.map(fmtD).join(', ')}`:''}.</div>`;
  const C=R.cohorts||[],nx=R.next_conversion,today=new Date();
  const st=c=>({converted:'converted',cancelled:'cancelled','partly cancelled':'partly','in trial':'trial'}[c.status]||'due');
  const isNext=c=>nx&&c.start===nx.start&&c.app===nx.app&&c.type===nx.type&&c.expected_first_charge===nx.expected_first_charge;
  const tbl=(rows,code)=>rows.length?`<table><tr><th>Started</th><th>App</th><th>Product</th><th>Trials</th>${code?'<th>Offer / code</th>':''}<th>Length</th><th>Expected 1st charge</th><th>Status</th></tr>${rows.map(c=>`<tr class="${isNext(c)?'next':''}"><td><span>${fmtD(c.start)}</span></td><td><span>${esc(c.app)}</span></td><td><span>${esc(c.product)}${c.price_usd?` · ${usd(c.price_usd)}`:''}${c.price_local?` <span class="mut">(${esc(c.price_local)})</span>`:''}</span></td><td><span>${num(c.count)} <span class="mut small">${esc(Object.keys(c.countries||{}).join(' '))}</span></span></td>${code?`<td><span>${esc(c.offer_name||'')}${c.offer_code?` <span class="mut small">${esc(c.offer_code)}</span>`:''}</span></td>`:''}<td><span>${esc(c.trial_length||'—')}</span></td><td><span>${c.expected_first_charge?new Date(c.expected_first_charge+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'—'}${isNext(c)?' ⭐':''}</span></td><td><span><span class="pill ${st(c)}">${esc(c.status)}</span>${c.cancellations?` <span class="small down">${c.cancellations} cancelled</span>`:''}${c.conversions?` <span class="small up">${c.conversions} paid</span>`:''}</span></td></tr>`).join('')}</table>`:'<div class="mut small" style="margin-top:8px">None yet.</div>';
  const intro=C.filter(c=>c.type==='intro trial'),codes=C.filter(c=>c.type!=='intro trial'),sum=a=>a.reduce((s,c)=>s+c.count,0);
  const dleft=nx?Math.ceil((new Date(nx.expected_first_charge+'T12:00:00')-today)/864e5):null;
  let cv=`<div class="grid">${card('Next possible paid conversion',nx?fmtD(nx.expected_first_charge):'—',nx?`<div class="t">${esc(nx.app)} · ${esc(nx.product)} · ${nx.count}× ${esc(nx.type)}</div><div class="t mut">${dleft>0?'in '+dleft+' day'+(dleft>1?'s':''):'due now'} · shows in reports ~${fmtD(nx.expected_in_reports)}</div>`:'<div class="t mut">no open trials</div>','hero next')}
   ${card('Intro free trials',num(sum(intro)),`<div class="t mut">real App Store trials</div>`)}${card('Offer-code redemptions',num(sum(codes)),`<div class="t mut">free-period codes</div>`)}${card('Converted',num(C.reduce((s,c)=>s+c.conversions,0)))}${card('Cancelled',num(C.reduce((s,c)=>s+c.cancellations,0)))}</div>
   <div class="chart mid"><canvas id="cCoh"></canvas></div>
   <h4><span class="pill intro">Intro free trials</span> real trials — can convert to paid</h4>${tbl(intro,false)}
   <h4><span class="pill code">Offer-code redemptions</span> free periods from codes</h4>${tbl(codes,true)}
   <div class="mut small" style="margin-top:8px">Expected first charge = start + trial length (estimate, assumes auto-renew stays on; Apple doesn't report auto-renew status until a cancel event). Paid plans show up in reports ~1 day after the charge. Subscription-event reports found for: ${esc((R.event_report_days||[]).map(fmtD).join(', ')||'none')}.</div>`;
  asc+=sec('installs','📈 Installs per day since launch',iv)+sec('cohorts','🧪 Trial cohorts',cv);
  const vl={id:'vl',afterDatasetsDraw(ch){const x=ch.ctx;x.save();x.font='600 11px Inter,system-ui';x.fillStyle='#e8ebf2';x.textAlign='center';ch.data.datasets.forEach((ds,i)=>{const m=ch.getDatasetMeta(i);if(m.hidden)return;m.data.forEach((b,j)=>{const v=ds.data[j];if(v)x.fillText(v,b.x,b.y-4)})});x.restore()}};
  mk('cInst',{type:'bar',plugins:[vl],data:{labels:R.dates.map(fmtD),datasets:ids.map(a=>({label:ins[a].name,data:ins[a].first_time.map((v,i)=>ins[a].launch&&R.dates[i]>=ins[a].launch?v:null),backgroundColor:COL[a]||'#c9ced8',borderRadius:6,barPercentage:.9,categoryPercentage:.85}))},options:{maintainAspectRatio:false,layout:{padding:{top:16}},plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true,ticks:{precision:0},title:{display:true,text:'First-time downloads'}},x:{ticks:{maxRotation:0,autoSkip:true}}}}});
  const sd=R.dates,cds=[];ids.forEach(a=>['intro trial','offer code'].forEach(t=>{const v=sd.map(x=>C.filter(c=>c.app_id===a&&c.start===x&&(t==='intro trial'?c.type===t:c.type!=='intro trial')).reduce((s,c)=>s+c.count,0));if(v.some(Boolean))cds.push({label:`${ins[a]?.name||a} · ${t}`,data:v.map(x=>x||null),stack:a,backgroundColor:t==='intro trial'?(COL[a]||'#ccc'):(COL[a]||'#ccc')+'99',borderColor:COL[a],borderWidth:t==='intro trial'?0:1.5,borderRadius:5,barPercentage:.9,categoryPercentage:.9})}));

  <div class="mut small" style="margin-top:8px">Universe ${g.universe_id}</div>`)});
